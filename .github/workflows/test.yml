name: 测试工作流

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # 后端单元测试
  backend-unit-tests:
    uses: ./.github/workflows/reusable/backend-test.yml
    with:
      test-type: unit
      coverage-flag: backend-unit
      coverage-name: backend-unit-coverage

  # 后端集成测试
  backend-integration-tests:
    uses: ./.github/workflows/reusable/backend-test.yml
    with:
      test-type: integration
      coverage-flag: backend-integration
      coverage-name: backend-integration-coverage

  # 后端完整测试和覆盖率
  backend-coverage:
    uses: ./.github/workflows/reusable/backend-test.yml
    with:
      test-type: coverage
      coverage-flag: backend
      coverage-name: backend-coverage
      upload-artifact: true

  # 智能合约测试
  smart-contract-tests:
    uses: ./.github/workflows/reusable/smart-contract-test.yml

  # 测试映射验证
  test-mapping-verification:
    name: 测试映射验证
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: '20'
      
      - name: 验证测试映射
        shell: bash
        run: node scripts/verify-test-mapping.js || echo "测试映射验证失败，但继续执行"
        continue-on-error: true
      
      - name: 生成测试映射报告
        shell: bash
        run: |
          GENERATE_JSON_REPORT=true node scripts/verify-test-mapping.js > test-mapping-report.txt 2>&1 || true
          cat test-mapping-report.txt
        continue-on-error: true
      
      - name: 上传测试映射报告
        uses: ./.github/actions/upload-artifact
        with:
          name: test-mapping-report
          path: |
            test-mapping-report.txt
            test-mapping-report.json
          retention-days: 30

  # 测试结果汇总
  test-summary:
    name: 测试结果汇总
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, backend-coverage, smart-contract-tests, test-mapping-verification]
    if: always()
    
    steps:
      - name: 生成测试摘要
        shell: bash
        run: |
          echo "# 测试执行摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试状态" >> $GITHUB_STEP_SUMMARY
          echo "- 后端单元测试: ${{ needs.backend-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 后端集成测试: ${{ needs.backend-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 后端覆盖率: ${{ needs.backend-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 智能合约测试: ${{ needs.smart-contract-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 测试映射验证: ${{ needs.test-mapping-verification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 覆盖率报告" >> $GITHUB_STEP_SUMMARY
          echo "查看详细覆盖率报告请下载后端覆盖率报告工件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 注意事项" >> $GITHUB_STEP_SUMMARY
          echo "- 某些测试可能因为缺少依赖而失败，这是正常的" >> $GITHUB_STEP_SUMMARY
          echo "- 智能合约测试需要Rust、Solana和Anchor环境" >> $GITHUB_STEP_SUMMARY
          echo "- Codecov上传需要配置CODECOV_TOKEN（可选）" >> $GITHUB_STEP_SUMMARY
